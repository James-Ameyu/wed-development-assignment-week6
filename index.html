
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main class="container">
        <section class="budget-card">
            <h2>My Budget Tracker</h2>
            <p>Manage your money and monitor your spending.</p>

            <button id="budgetButton">Calculate My Budget</button>

            <div id="results">
                <h3>Budget Results</h3>
                <p id="budgetOutput">Your budget will appear here.</p>
                <p id="expensesOutput"></p>
                <p id="balanceOutput"></p>
            </div>
        </section>

        <section class="categories">
            <h2>Expense Categories</h2>
            <div class="category-list">
                <div>Food</div>
                <div>Transport</div>
                <div>Rent</div>
                <div>Entertainment</div>
                <div>Other</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise Budget Tracker</p>
    </footer>

</body>
</html>
